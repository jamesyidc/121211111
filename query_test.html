<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query页面诊断</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>🔍 Query 页面诊断工具</h1>
    
    <div class="section">
        <h2>1. 页面加载状态</h2>
        <p id="loadStatus" class="info">检查中...</p>
    </div>

    <div class="section">
        <h2>2. API 测试</h2>
        <button onclick="testAllAPIs()">测试所有 API</button>
        <pre id="apiResults">点击按钮开始测试...</pre>
    </div>

    <div class="section">
        <h2>3. 浏览器信息</h2>
        <pre id="browserInfo"></pre>
    </div>

    <div class="section">
        <h2>4. 网络连接测试</h2>
        <button onclick="testNetwork()">测试网络连接</button>
        <pre id="networkResults">点击按钮开始测试...</pre>
    </div>

    <script>
        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loadStatus').innerHTML = '<span class="success">✅ 页面加载成功</span>';
            document.getElementById('loadStatus').innerHTML += '<br>加载时间: ' + new Date().toLocaleString('zh-CN');
            
            // 显示浏览器信息
            const browserInfo = {
                'User Agent': navigator.userAgent,
                '窗口大小': `${window.innerWidth} x ${window.innerHeight}`,
                '语言': navigator.language,
                'Cookie启用': navigator.cookieEnabled,
                '在线状态': navigator.onLine,
                '平台': navigator.platform
            };
            
            let infoHtml = '';
            for (let key in browserInfo) {
                infoHtml += `${key}: ${browserInfo[key]}\n`;
            }
            document.getElementById('browserInfo').textContent = infoHtml;
        });

        async function testAllAPIs() {
            const results = document.getElementById('apiResults');
            results.innerHTML = '测试中...\n';
            
            const apis = [
                '/api/stats',
                '/api/latest',
                '/api/timeline',
                '/api/chart?page=0'
            ];
            
            let output = '';
            
            for (const api of apis) {
                try {
                    const startTime = Date.now();
                    const response = await fetch(api, {
                        cache: 'no-store'
                    });
                    const endTime = Date.now();
                    const data = await response.json();
                    
                    output += `\n✅ ${api}\n`;
                    output += `   状态: ${response.status}\n`;
                    output += `   耗时: ${endTime - startTime}ms\n`;
                    
                    if (data.error) {
                        output += `   ❌ 错误: ${data.error}\n`;
                    } else {
                        // 显示关键数据
                        if (api === '/api/stats') {
                            output += `   总记录: ${data.total_records}\n`;
                            output += `   今日数据: ${data.today_records}\n`;
                        } else if (api === '/api/latest') {
                            output += `   快照时间: ${data.snapshot_time}\n`;
                            output += `   急涨: ${data.rush_up}, 急跌: ${data.rush_down}\n`;
                        } else if (api === '/api/timeline') {
                            output += `   数据点: ${data.snapshots ? data.snapshots.length : 0}\n`;
                        }
                    }
                } catch (err) {
                    output += `\n❌ ${api}\n`;
                    output += `   错误: ${err.message}\n`;
                }
            }
            
            results.textContent = output;
        }

        async function testNetwork() {
            const results = document.getElementById('networkResults');
            results.innerHTML = '测试中...\n';
            
            let output = '';
            
            // 测试1: 基本连接
            try {
                const start = Date.now();
                const response = await fetch(window.location.origin + '/api/stats');
                const end = Date.now();
                output += `✅ 基本连接正常\n`;
                output += `   响应时间: ${end - start}ms\n`;
                output += `   状态码: ${response.status}\n`;
            } catch (err) {
                output += `❌ 基本连接失败: ${err.message}\n`;
            }
            
            // 测试2: 跨域请求
            try {
                const response = await fetch('https://httpbin.org/get', {
                    mode: 'cors'
                });
                output += `\n✅ 跨域请求正常\n`;
            } catch (err) {
                output += `\n❌ 跨域请求失败: ${err.message}\n`;
            }
            
            // 测试3: 缓存策略
            output += `\n缓存测试:\n`;
            const cacheURL = '/api/stats?test=' + Date.now();
            try {
                const r1 = await fetch(cacheURL);
                const r2 = await fetch(cacheURL, { cache: 'no-store' });
                output += `   ✅ 缓存策略正常工作\n`;
            } catch (err) {
                output += `   ❌ 缓存测试失败: ${err.message}\n`;
            }
            
            results.textContent = output;
        }

        // 自动运行测试
        setTimeout(() => {
            testAllAPIs();
        }, 1000);
    </script>
</body>
</html>
