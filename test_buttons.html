<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>按钮测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-4">批量操作按钮测试</h1>
    
    <div id="test-container" class="space-y-4"></div>
    
    <script>
        const testEvents = [
            {event_name: "强空头爆仓", action: "开空", confidence: "高"},
            {event_name: "弱空头爆仓", action: "开空（谨慎）", confidence: "中"}
        ];
        
        const tradingUrl = 'https://5000-i4rq388xy9v1hw2uaz7ln-b9b802c4.sandbox.novita.ai/okx-trading';
        
        testEvents.forEach(event => {
            console.log(`测试事件: ${event.event_name}, action: "${event.action}"`);
            
            let buttons = [];
            
            if (event.action && event.action.includes('开空')) {
                console.log("✅ 匹配成功，生成按钮");
                
                buttons.push(`
                    <a href="${tradingUrl}" target="_blank" 
                       class="inline-flex items-center px-3 py-2 bg-gradient-to-r from-red-400 to-red-500 text-white rounded-lg text-sm font-medium hover:from-red-500 hover:to-red-600 transition-all transform hover:scale-105 shadow-md">
                        <i class="fas fa-arrow-down mr-2"></i>
                        空单策略 A
                        <span class="ml-2 text-xs opacity-90">5%余额·10x</span>
                    </a>
                `);
                
                buttons.push(`
                    <a href="${tradingUrl}" target="_blank" 
                       class="inline-flex items-center px-3 py-2 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-lg text-sm font-medium hover:from-red-600 hover:to-red-700 transition-all transform hover:scale-105 shadow-md">
                        <i class="fas fa-arrow-down mr-2"></i>
                        空单策略 B
                        <span class="ml-2 text-xs opacity-90">8%余额·10x</span>
                    </a>
                `);
                
                buttons.push(`
                    <a href="${tradingUrl}" target="_blank" 
                       class="inline-flex items-center px-3 py-2 bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-lg text-sm font-medium hover:from-orange-600 hover:to-orange-700 transition-all transform hover:scale-105 shadow-md">
                        <i class="fas fa-balance-scale mr-2"></i>
                        多单配空单
                        <span class="ml-2 text-xs opacity-90">1:1对冲</span>
                    </a>
                `);
            }
            
            const html = `
                <div class="bg-white rounded-lg p-6 border-l-4 border-red-500">
                    <h3 class="text-lg font-bold mb-2">${event.event_name}</h3>
                    <p class="text-gray-600 mb-2">Action: ${event.action}</p>
                    <div class="mt-4 pt-4 border-t border-gray-200">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-sm font-semibold text-gray-700">
                                <i class="fas fa-bolt mr-1 text-yellow-500"></i>
                                批量开仓策略
                            </span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${buttons.join('')}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('test-container').innerHTML += html;
        });
    </script>
</body>
</html>
