<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图表测试</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        #chart { width: 100%; height: 500px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>图表渲染测试</h1>
    <div id="chart"></div>
    <div id="status"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        // 1. 检查ECharts是否加载
        if (typeof echarts === 'undefined') {
            statusDiv.innerHTML = '<p style="color:red">❌ ECharts未加载！</p>';
        } else {
            statusDiv.innerHTML = '<p style="color:green">✅ ECharts已加载</p>';
        }
        
        // 2. 初始化图表
        const chartDom = document.getElementById('chart');
        const chart = echarts.init(chartDom);
        statusDiv.innerHTML += '<p style="color:green">✅ 图表实例创建成功</p>';
        
        // 3. 加载真实数据
        fetch('/api/escape-signal-stats/keypoints?v=' + Date.now())
        .then(r => r.json())
        .then(result => {
            statusDiv.innerHTML += '<p>✅ 数据加载成功: ' + result.keypoint_count + ' 个点</p>';
            
            const times = result.keypoints.map(d => d.stat_time.substring(5, 16));
            const signal24h = result.keypoints.map(d => d.signal_24h_count);
            const signal2h = result.keypoints.map(d => d.signal_2h_count);
            
            statusDiv.innerHTML += '<p>times: ' + times.length + ', signal24h: ' + signal24h.length + ', signal2h: ' + signal2h.length + '</p>';
            
            // 4. 设置图表
            chart.setOption({
                title: { text: '逃顶信号趋势' },
                tooltip: { trigger: 'axis' },
                legend: { data: ['24小时信号', '2小时信号'] },
                xAxis: { 
                    type: 'category',
                    data: times
                },
                yAxis: { type: 'value' },
                series: [
                    {
                        name: '24小时信号',
                        type: 'line',
                        data: signal24h,
                        smooth: true
                    },
                    {
                        name: '2小时信号',
                        type: 'line',
                        data: signal2h,
                        smooth: true
                    }
                ]
            });
            
            statusDiv.innerHTML += '<p style="color:green;font-weight:bold">✅ 图表渲染完成！</p>';
        })
        .catch(err => {
            statusDiv.innerHTML += '<p style="color:red">❌ 错误: ' + err.message + '</p>';
        });
    </script>
</body>
</html>
