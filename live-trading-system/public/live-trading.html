<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKX实盘交易</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-active {
            background-color: #3b82f6;
            color: white;
        }
        .tab-inactive {
            background-color: #e5e7eb;
            color: #6b7280;
        }
        .input-group input, .input-group select {
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem;
        }
        .btn-primary {
            background-color: #10b981;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 0.375rem;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #059669;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 0.375rem;
            transition: background-color 0.3s;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .position-card {
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.3s;
        }
        .position-card:hover {
            border-color: #3b82f6;
        }
        .position-long {
            border-left: 4px solid #10b981;
        }
        .position-short {
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg mb-6">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-chart-line text-blue-500"></i> OKX实盘交易
                </h1>
                <div class="flex gap-4">
                    <a href="/" class="text-blue-500 hover:text-blue-700">
                        <i class="fas fa-home"></i> 返回首页
                    </a>
                    <button onclick="refreshData()" class="text-green-500 hover:text-green-700">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4">
        <!-- 账户信息 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">
                <i class="fas fa-wallet text-green-500"></i> 账户信息
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="text-center">
                    <p class="text-gray-500 text-sm">总权益</p>
                    <p class="text-2xl font-bold" id="totalEquity">--</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-500 text-sm">可用余额</p>
                    <p class="text-2xl font-bold text-green-600" id="availableBalance">--</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-500 text-sm">未实现盈亏</p>
                    <p class="text-2xl font-bold" id="unrealizedPnl">--</p>
                </div>
                <div class="text-center">
                    <p class="text-gray-500 text-sm">已实现盈亏</p>
                    <p class="text-2xl font-bold" id="realizedPnl">--</p>
                </div>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <div class="flex border-b">
                <button class="px-6 py-3 tab-active" onclick="switchTab('order')" id="tab-order">
                    <i class="fas fa-plus-circle"></i> 下单
                </button>
                <button class="px-6 py-3 tab-inactive" onclick="switchTab('positions')" id="tab-positions">
                    <i class="fas fa-briefcase"></i> 持仓管理
                </button>
                <button class="px-6 py-3 tab-inactive" onclick="switchTab('history')" id="tab-history">
                    <i class="fas fa-history"></i> 历史记录
                </button>
                <button class="px-6 py-3 tab-inactive" onclick="switchTab('config')" id="tab-config">
                    <i class="fas fa-cog"></i> API配置
                </button>
            </div>

            <!-- 下单面板 -->
            <div id="panel-order" class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 限价委托 -->
                    <div class="border rounded-lg p-4">
                        <h3 class="text-lg font-bold mb-4">
                            <i class="fas fa-chart-bar text-blue-500"></i> 限价委托
                        </h3>
                        
                        <div class="space-y-4">
                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">交易对</label>
                                <select id="limitSymbol" class="w-full">
                                    <!-- 动态填充 -->
                                </select>
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">方向</label>
                                <div class="flex gap-2">
                                    <button onclick="setLimitSide('buy')" class="flex-1 py-2 rounded bg-green-500 text-white hover:bg-green-600" id="limit-buy">
                                        做多
                                    </button>
                                    <button onclick="setLimitSide('sell')" class="flex-1 py-2 rounded bg-gray-300 hover:bg-gray-400" id="limit-sell">
                                        做空
                                    </button>
                                </div>
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">价格类型</label>
                                <select id="limitPriceType" class="w-full">
                                    <option value="opponent1">对手价1档</option>
                                    <option value="opponent5">对手价5档</option>
                                    <option value="optimal1">同向价1档</option>
                                    <option value="optimal5">同向价5档</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">杠杆倍数</label>
                                <div class="flex gap-2">
                                    <button onclick="setLimitLeverage(3)" class="flex-1 py-2 rounded bg-gray-200 hover:bg-gray-300">3x</button>
                                    <button onclick="setLimitLeverage(5)" class="flex-1 py-2 rounded bg-gray-200 hover:bg-gray-300">5x</button>
                                    <button onclick="setLimitLeverage(10)" class="flex-1 py-2 rounded bg-blue-500 text-white">10x</button>
                                    <button onclick="setLimitLeverage(20)" class="flex-1 py-2 rounded bg-gray-200 hover:bg-gray-300">20x</button>
                                </div>
                                <input type="hidden" id="limitLeverage" value="10">
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">数量 (USDT)</label>
                                <input type="number" id="limitAmount" placeholder="输入USDT数量" class="w-full">
                                <div class="flex gap-2 mt-2">
                                    <button onclick="setLimitPercentage(10)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">10%</button>
                                    <button onclick="setLimitPercentage(25)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">25%</button>
                                    <button onclick="setLimitPercentage(33)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">33%</button>
                                    <button onclick="setLimitPercentage(50)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">50%</button>
                                    <button onclick="setLimitPercentage(100)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">100%</button>
                                </div>
                            </div>

                            <button onclick="submitLimitOrder()" class="w-full btn-primary">
                                <i class="fas fa-paper-plane"></i> 提交限价单
                            </button>
                        </div>
                    </div>

                    <!-- 市价委托 -->
                    <div class="border rounded-lg p-4">
                        <h3 class="text-lg font-bold mb-4">
                            <i class="fas fa-bolt text-yellow-500"></i> 市价委托
                        </h3>
                        
                        <div class="space-y-4">
                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">交易对</label>
                                <select id="marketSymbol" class="w-full">
                                    <!-- 动态填充 -->
                                </select>
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">方向</label>
                                <div class="flex gap-2">
                                    <button onclick="setMarketSide('buy')" class="flex-1 py-2 rounded bg-green-500 text-white hover:bg-green-600" id="market-buy">
                                        做多
                                    </button>
                                    <button onclick="setMarketSide('sell')" class="flex-1 py-2 rounded bg-gray-300 hover:bg-gray-400" id="market-sell">
                                        做空
                                    </button>
                                </div>
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">杠杆倍数</label>
                                <div class="flex gap-2">
                                    <button onclick="setMarketLeverage(3)" class="flex-1 py-2 rounded bg-gray-200 hover:bg-gray-300">3x</button>
                                    <button onclick="setMarketLeverage(5)" class="flex-1 py-2 rounded bg-gray-200 hover:bg-gray-300">5x</button>
                                    <button onclick="setMarketLeverage(10)" class="flex-1 py-2 rounded bg-blue-500 text-white">10x</button>
                                    <button onclick="setMarketLeverage(20)" class="flex-1 py-2 rounded bg-gray-200 hover:bg-gray-300">20x</button>
                                </div>
                                <input type="hidden" id="marketLeverage" value="10">
                            </div>

                            <div class="input-group">
                                <label class="block text-sm font-medium mb-1">数量 (USDT)</label>
                                <input type="number" id="marketAmount" placeholder="输入USDT数量" class="w-full">
                                <div class="flex gap-2 mt-2">
                                    <button onclick="setMarketPercentage(10)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">10%</button>
                                    <button onclick="setMarketPercentage(25)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">25%</button>
                                    <button onclick="setMarketPercentage(33)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">33%</button>
                                    <button onclick="setMarketPercentage(50)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">50%</button>
                                    <button onclick="setMarketPercentage(100)" class="flex-1 py-1 text-sm rounded bg-gray-200 hover:bg-gray-300">100%</button>
                                </div>
                            </div>

                            <button onclick="submitMarketOrder()" class="w-full btn-primary">
                                <i class="fas fa-bolt"></i> 提交市价单
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 持仓管理面板 -->
            <div id="panel-positions" class="p-6 hidden">
                <div id="positionsList">
                    <!-- 动态填充持仓 -->
                </div>
            </div>

            <!-- 历史记录面板 -->
            <div id="panel-history" class="p-6 hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 text-left">时间</th>
                                <th class="px-4 py-2 text-left">币种</th>
                                <th class="px-4 py-2 text-left">方向</th>
                                <th class="px-4 py-2 text-right">开仓价</th>
                                <th class="px-4 py-2 text-right">平仓价</th>
                                <th class="px-4 py-2 text-right">盈亏</th>
                                <th class="px-4 py-2 text-right">收益率</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- API配置面板 -->
            <div id="panel-config" class="p-6 hidden">
                <div class="max-w-2xl mx-auto space-y-4">
                    <div class="input-group">
                        <label class="block text-sm font-medium mb-1">API Key</label>
                        <input type="text" id="apiKey" placeholder="输入OKX API Key" class="w-full">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-medium mb-1">API Secret</label>
                        <input type="password" id="apiSecret" placeholder="输入OKX API Secret" class="w-full">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-medium mb-1">Passphrase</label>
                        <input type="password" id="passphrase" placeholder="输入OKX Passphrase" class="w-full">
                    </div>
                    <div class="input-group">
                        <label class="flex items-center">
                            <input type="checkbox" id="isTestnet" class="mr-2">
                            <span>使用测试网</span>
                        </label>
                    </div>
                    <button onclick="saveConfig()" class="w-full btn-primary">
                        <i class="fas fa-save"></i> 保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/live-trading.js"></script>
</body>
</html>
