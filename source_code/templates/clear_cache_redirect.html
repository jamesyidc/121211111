    <meta http-equiv="Expires" content="0">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        .spinner {

        .manual-link a {

    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 正在清除浏览器缓存</h1>
        <div class="spinner"></div>
        <div class="message">
            ✨ 正在清理旧版本的JavaScript代码...<br>
            ✨ 正在刷新图表库资源...<br>
            ✨ 准备加载最新版本...
        </div>
        <div class="countdown" id="countdown">3</div>
        <div style="font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 20px;">
            页面将在 <span id="countdownText">3</span> 秒后自动跳转
        </div>
        <div class="manual-link">
            <a href="/escape-signal-history-v2?force=<?php echo time(); ?>" id="manualLink">点击立即跳转</a>
        </div>
    </div>

    <script>
        // 清除所有缓存
        console.log('🧹 开始清除缓存...');
        
        // 1. 清除localStorage
        try {
            localStorage.clear();
            console.log('✅ localStorage已清除');
        } catch(e) {
            console.warn('⚠️ localStorage清除失败:', e);
        }
        
        // 2. 清除sessionStorage
        try {
            sessionStorage.clear();
            console.log('✅ sessionStorage已清除');
        } catch(e) {
            console.warn('⚠️ sessionStorage清除失败:', e);
        }
        
        // 3. 清除所有cookies
        try {
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            console.log('✅ Cookies已清除');
        } catch(e) {
            console.warn('⚠️ Cookies清除失败:', e);
        }
        
        // 4. 清除Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
                console.log('✅ Service Workers已清除');
            });
        }
        
        // 5. 清除Cache API
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) {
                    caches.delete(name);
                }
                console.log('✅ Cache API已清除');
            });
        }
        
        // 倒计时跳转
        let count = 3;
        const countdownElement = document.getElementById('countdown');
        const countdownText = document.getElementById('countdownText');
        const manualLink = document.getElementById('manualLink');
        
        // 生成带时间戳的URL，确保不使用缓存
        const timestamp = new Date().getTime();
        const targetUrl = `/escape-signal-history-v2?nocache=${timestamp}&force=1`;
        manualLink.href = targetUrl;
        
        const interval = setInterval(() => {
            count--;
            countdownElement.textContent = count;
            countdownText.textContent = count;
            
            if (count <= 0) {
                clearInterval(interval);
                console.log('🚀 跳转到:', targetUrl);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
