<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27币涨跌幅追踪系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg mb-6">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/" class="inline-flex items-center px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg hover:from-blue-600 hover:to-blue-700 transition-all duration-200 shadow-md hover:shadow-lg">
                        <i class="fas fa-home mr-2"></i>
                        返回首页
                    </a>
                    <h1 class="text-2xl font-bold text-gray-800">
                        <i class="fas fa-chart-line text-blue-600 mr-2"></i>
                        27币涨跌幅追踪系统
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600">
                        <i class="far fa-clock mr-1"></i>
                        1分钟周期
                    </span>
                    <span class="text-sm text-gray-600">
                        <i class="fas fa-sync-alt mr-1"></i>
                        每天0点重置
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <!-- 实时数据卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <!-- 总涨跌幅 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 font-medium">27币涨跌幅之和</span>
                    <i class="fas fa-percentage text-blue-600"></i>
                </div>
                <div id="totalChange" class="text-3xl font-bold text-gray-800">--</div>
                <div class="text-sm text-gray-500 mt-2">
                    <i class="far fa-clock mr-1"></i>
                    <span id="updateTime">--</span>
                </div>
            </div>

            <!-- 有效币种数 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 font-medium">有效币种数</span>
                    <i class="fas fa-coins text-green-600"></i>
                </div>
                <div id="validCount" class="text-3xl font-bold text-gray-800">--</div>
                <div class="text-sm text-gray-500 mt-2">
                    共 27 个币种
                </div>
            </div>

            <!-- 基准价时间 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-600 font-medium">基准价时间</span>
                    <i class="fas fa-calendar-alt text-purple-600"></i>
                </div>
                <div id="baselineDate" class="text-2xl font-bold text-gray-800">--</div>
                <div class="text-sm text-gray-500 mt-2">
                    每天0点重置
                </div>
            </div>
        </div>

        <!-- 图表区域 - 趋势图独占一行，放大2倍 -->
        <div class="grid grid-cols-1 gap-6 mb-6">
            <!-- 总涨跌幅趋势图 - 放大2倍 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">
                    <i class="fas fa-chart-area text-blue-600 mr-2"></i>
                    总涨跌幅趋势（今日）
                    <span class="text-sm font-normal text-gray-500 ml-2">
                        <i class="fas fa-arrow-up text-red-500"></i> 最高价
                        <i class="fas fa-arrow-down text-green-500 ml-3"></i> 最低价
                    </span>
                </h2>
                <div id="trendChart" style="height: 800px;"></div>
            </div>
        </div>

        <!-- 排行榜 -->
        <div class="grid grid-cols-1 gap-6 mb-6">
            <!-- 单币涨跌幅排行 -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold mb-4">
                    <i class="fas fa-trophy text-yellow-600 mr-2"></i>
                    单币涨跌幅排行（实时）
                </h2>
                <div id="rankChart" style="height: 800px;"></div>
            </div>
        </div>

        <!-- 详细数据表格 -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4">
                <i class="fas fa-table text-green-600 mr-2"></i>
                详细数据（27个币种）
            </h2>
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">币种</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">基准价</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">当前价</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">涨跌幅</th>
                        </tr>
                    </thead>
                    <tbody id="detailTable" class="bg-white divide-y divide-gray-200">
                        <!-- 数据将在这里填充 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 图表实例
        let trendChart = null;
        let rankChart = null;
        
        // 历史数据（用于趋势图）
        let historyData = [];
        
        // 初始化图表
        function initCharts() {
            trendChart = echarts.init(document.getElementById('trendChart'));
            rankChart = echarts.init(document.getElementById('rankChart'));
            
            // 趋势图配置
            trendChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        const p = params[0];
                        return `${p.axisValue}<br/>${p.marker}${p.seriesName}: ${p.value}%`;
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: []
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: '{value}%'
                    }
                },
                series: [{
                    name: '27币涨跌幅之和',
                    type: 'line',
                    smooth: true,
                    data: [],
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(59, 130, 246, 0.5)' },
                                { offset: 1, color: 'rgba(59, 130, 246, 0.1)' }
                            ]
                        }
                    },
                    lineStyle: {
                        color: '#3B82F6',
                        width: 2
                    }
                }]
            });
        }
        
        // 更新实时数据
        async function updateLatestData() {
            try {
                const response = await fetch('/api/coin-change-tracker/latest');
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    // 更新卡片数据
                    const totalChange = data.total_change;
                    const totalChangeEl = document.getElementById('totalChange');
                    totalChangeEl.textContent = `${totalChange > 0 ? '+' : ''}${totalChange.toFixed(2)}%`;
                    totalChangeEl.className = `text-3xl font-bold ${totalChange > 0 ? 'text-green-600' : totalChange < 0 ? 'text-red-600' : 'text-gray-800'}`;
                    
                    document.getElementById('validCount').textContent = `${data.valid_count}/27`;
                    document.getElementById('updateTime').textContent = data.time;
                    document.getElementById('baselineDate').textContent = data.baseline_date;
                    
                    // 更新单币排行榜
                    updateRankChart(data.changes);
                    
                    // 更新详细表格
                    updateDetailTable(data.changes);
                    
                } else {
                    console.error('获取数据失败:', result.error);
                }
            } catch (error) {
                console.error('更新数据异常:', error);
            }
        }
        
        // 更新历史趋势
        async function updateHistoryData() {
            try {
                const response = await fetch('/api/coin-change-tracker/history?limit=1440');
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    historyData = result.data;
                    
                    // 提取时间和总涨跌幅
                    const times = historyData.map(d => d.time);
                    const changes = historyData.map(d => d.total_change);
                    
                    // 找出最高价和最低价
                    const maxChange = Math.max(...changes);
                    const minChange = Math.min(...changes);
                    const maxIndex = changes.indexOf(maxChange);
                    const minIndex = changes.indexOf(minChange);
                    
                    // 更新趋势图，添加最高价和最低价标记
                    trendChart.setOption({
                        xAxis: { data: times },
                        series: [{
                            data: changes,
                            markPoint: {
                                data: [
                                    {
                                        name: '最高价',
                                        value: maxChange.toFixed(2) + '%',
                                        xAxis: maxIndex,
                                        yAxis: maxChange,
                                        itemStyle: {
                                            color: '#EF4444'
                                        },
                                        label: {
                                            formatter: '{b}\n{c}',
                                            fontSize: 14,
                                            fontWeight: 'bold'
                                        }
                                    },
                                    {
                                        name: '最低价',
                                        value: minChange.toFixed(2) + '%',
                                        xAxis: minIndex,
                                        yAxis: minChange,
                                        itemStyle: {
                                            color: '#10B981'
                                        },
                                        label: {
                                            formatter: '{b}\n{c}',
                                            fontSize: 14,
                                            fontWeight: 'bold'
                                        }
                                    }
                                ],
                                symbol: 'pin',
                                symbolSize: 60
                            },
                            markLine: {
                                silent: true,
                                lineStyle: {
                                    color: '#ddd',
                                    type: 'dashed'
                                },
                                data: [
                                    { yAxis: maxChange },
                                    { yAxis: minChange }
                                ]
                            }
                        }]
                    });
                }
            } catch (error) {
                console.error('更新历史数据异常:', error);
            }
        }
        
        // 更新排行榜图表
        function updateRankChart(changes) {
            const validChanges = Object.entries(changes).filter(([_, v]) => !v.error);
            validChanges.sort((a, b) => b[1].change_pct - a[1].change_pct);
            
            const coins = validChanges.map(([k, _]) => k.replace('-USDT-SWAP', ''));
            const values = validChanges.map(([_, v]) => v.change_pct);
            
            rankChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        const p = params[0];
                        return `${p.axisValue}<br/>${p.marker}涨跌幅: ${p.value}%`;
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: '{value}%'
                    }
                },
                yAxis: {
                    type: 'category',
                    data: coins,
                    inverse: true
                },
                series: [{
                    type: 'bar',
                    data: values.map(v => ({
                        value: v,
                        itemStyle: {
                            color: v > 0 ? '#10B981' : v < 0 ? '#EF4444' : '#6B7280'
                        }
                    }))
                }]
            });
        }
        
        // 更新详细表格
        function updateDetailTable(changes) {
            const tbody = document.getElementById('detailTable');
            
            // 转换为数组并排序
            const changesArray = Object.entries(changes)
                .filter(([_, v]) => !v.error)
                .sort((a, b) => b[1].change_pct - a[1].change_pct);
            
            tbody.innerHTML = changesArray.map(([symbol, data]) => {
                const coin = symbol.replace('-USDT-SWAP', '');
                const changePct = data.change_pct;
                const changeClass = changePct > 0 ? 'text-green-600' : changePct < 0 ? 'text-red-600' : 'text-gray-600';
                const changePrefix = changePct > 0 ? '+' : '';
                
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap font-medium">${coin}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-600">$${data.baseline_price.toFixed(4)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-gray-600">$${data.current_price.toFixed(4)}</td>
                        <td class="px-6 py-4 whitespace-nowrap ${changeClass} font-bold">${changePrefix}${changePct.toFixed(2)}%</td>
                    </tr>
                `;
            }).join('');
        }
        
        // 初始化
        window.onload = function() {
            initCharts();
            updateLatestData();
            updateHistoryData();
            
            // 每10秒更新实时数据
            setInterval(updateLatestData, 10000);
            
            // 每分钟更新历史数据
            setInterval(updateHistoryData, 60000);
            
            // 窗口大小改变时重绘图表
            window.addEventListener('resize', () => {
                trendChart.resize();
                rankChart.resize();
            });
        };
    </script>
</body>
</html>
