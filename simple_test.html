<!DOCTYPE html>
<html>
<head><title>Simple Test</title></head>
<body>
<pre id="output">Loading...</pre>
<script>
const out = document.getElementById('output');
fetch('/api/anchor-profit/history?limit=100')
    .then(r => r.json())
    .then(data => {
        out.textContent = JSON.stringify({
            count: data.data.length,
            latest: data.data[data.data.length - 1]?.datetime,
            latestTimestamp: data.data[data.data.length - 1]?.timestamp,
            latestStats: data.data[data.data.length - 1]?.stats
        }, null, 2);
    })
    .catch(e => {
        out.textContent = 'Error: ' + e.message;
    });
</script>
</body>
</html>
